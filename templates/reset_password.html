<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ELAN TECH</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Unbounded:wght@500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/styles.css" />
    <script src="/script.js" defer></script>
  </head>
  <body class="auth-page" data-page="reset-password" data-token="{{ token }}" data-token-valid="{{ 'true' if token_valid else 'false' }}">
    <div class="page-shell">
      <header class="cabinet-header">
        <nav class="topbar">
          <a class="brand" href="/" aria-label="ELAN TECH — перейти на главную">
            <span class="brand-mark">É</span>
            <div>
              <h1>ELAN TECH</h1>
            </div>
          </a>
          <div class="topbar-actions">
            <a href="/auth" class="ghost-link">Ко входу</a>
          </div>
        </nav>

        <section class="cabinet-intro auth-intro">
          <div class="section-heading compact">
            <h2>Новый пароль</h2>
          </div>
        </section>
      </header>

      <main>
        <section class="section auth-section standalone-auth">
          <div class="auth-grid">
            <div class="auth-card auth-shell">
              <div class="window-bar">
                <span></span><span></span><span></span>
              </div>
              {% if token_valid %}
              <form class="auth-form-panel active" id="reset-password-form">
                <h3>Установить новый пароль</h3>
                <p class="auth-text">Введите новый пароль для вашего аккаунта.</p>
                <label>
                  <span>Новый пароль</span>
                  <input name="password" type="password" placeholder="Минимум 6 символов" minlength="6" required />
                </label>
                <label>
                  <span>Повторите пароль</span>
                  <input name="password_repeat" type="password" placeholder="Повторите пароль" minlength="6" required />
                </label>
                <button class="cta-button wide" type="submit">Обновить пароль</button>
              </form>
              {% else %}
              <div class="auth-form-panel active">
                <h3>Ссылка недействительна</h3>
                <p class="auth-text">Срок действия ссылки истёк или она уже была использована.</p>
                <a href="/forgot-password" class="cta-button wide">Запросить новую ссылку</a>
              </div>
              {% endif %}
              <p class="form-message" id="reset-password-message" aria-live="polite"></p>
            </div>
          </div>
        </section>
      </main>
    </div>
  </body>
</html>
